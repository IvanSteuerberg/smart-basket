# Development convenience: `uv run alembic upgrade head` from backend/.
# The services use `smart-basket-migrate`, which points at the same scripts.
# The database URL comes from DATABASE_URL (see smart_basket.config).
[alembic]
script_location = %(here)s/src/smart_basket/db/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
